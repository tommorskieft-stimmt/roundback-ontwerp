<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Roundback · Lightbox foto</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,0..100,0..1;1,9..144,300..600,0..100,0..1&family=Albert+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#EFE7DB}a:hover{color:#D4955F}
.pp *{box-sizing:border-box}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(6px);transform:scale(1.04)}
.dim{position:absolute;inset:0;background:rgba(13,16,19,.72)}
.dim{background:rgba(13,16,19,.96)}
.top{position:absolute;left:56px;right:56px;top:18px;display:flex;justify-content:space-between;align-items:center;color:#EFE7DB}
.ct{font:600 12px 'Albert Sans',sans-serif;letter-spacing:.14em;color:#CFC0AA}
.btn{width:48px;height:48px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:#EFE7DB}
.btn.hov{background:rgba(239,231,219,.1);color:#D4955F}
.stage{position:absolute;left:56px;right:56px;top:84px;height:702px;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:12px}
.media{position:relative;height:702px;display:grid;place-items:center}
.media img{max-width:100%;max-height:702px;display:block}
.cap{position:absolute;left:0;right:0;bottom:26px;margin:0;text-align:center;font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-style:italic;font-weight:300;font-size:20px;color:#EFE7DB}
.play{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;display:grid;place-items:center;background:rgba(239,231,219,.92);color:#141C24}
.play svg{margin-left:4px}
.note{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 14px;border-radius:2px;background:rgba(20,28,36,.8);font-size:13px;color:#EFE7DB;white-space:nowrap}

</style>
</helmet>
<div class="pp" style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: 'Albert Sans', system-ui, sans-serif; background: #141C24">
  <img class="bg" src="./assets/f2c1cc22017f0003ba93820863223680.webp" alt="">
  <div class="dim"></div>
  <div role="dialog" aria-modal="true" aria-label="Foto's en video's van Roundback">
    <div class="top"><span class="ct">01 / 07</span><button class="btn" type="button" aria-label="Sluiten"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 3 10 10M13 3 3 13"/></svg></button></div>
    <div class="stage">
      <button class="btn" type="button" aria-label="Vorige"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
      <div class="media">
        <img src="./assets/f2c1cc22017f0003ba93820863223680.webp" alt="Het trio live">
      </div>
      <button class="btn hov" type="button" aria-label="Volgende"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
    </div>
    <p class="cap">Het trio live</p>
  </div>
</div>
</x-dc>

  renderVals() { return {}; }
}
</script>

</body>
</html>
